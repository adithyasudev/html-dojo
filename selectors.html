<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
</head>
<body>
  <label for="pet-select">Choosing the Pet:</label>  
  <select name="pets" id="pet-select">
    <option value="">--Please Choose an Option</option>
    <option value="lion" >Lion</option>
    <option value="tiger">Tiger</option>
    <option value="honey badger">Honey Badger</option>
    <option value="wolverine">Wolverine</option>
    <option value="panda">Panda</option>
  </select>
  <br></br>
  <input type="submit" value="click it">
<br><br><br><br><br>
<fieldset>
    <legend>CURRENT LEARNING</legend>
  <div>
    <input type="radio" name="coding" id="html">
          <label for="html">HTML</label>
    
      </div><br>
      <div>
          <input type="radio" name="coding" id="css">
          <label for="css">CSS</label>
      </div><br>
      <div>
    <input type="radio" name="coding" id="js">
          <label for="js">JAVASCRIPT</label>
    
      </div><br>
      <div>
    <input type="radio" name="coding" id="tailwindcss">
          <label for="tailwind">TAILWIND-CSS</label>
    
      </div><br>
      <div>
        <input type="radio" name="coding" id="react">
          <label for="react">REACT</label>
    
      </div><br>
      <input type="radio" name="coding" id="typescript">
      <label for="typescript">TYPESCRIPT</label>
    
</fieldset>
<br><br><br><br><br>
<fieldset>
    <legend>Completed</legend>
    <div>
<input type="checkbox" name="coding" id="html">
          <label for="html">HTML</label>
    </div><br><br>

    <div>
<input type="checkbox" name="coding" id="css">
<label for="css">CSS</label>
    </div>
    <br><br>
    <div>
<input type="checkbox" name="coding" id="js">
          <label for="js">JAVASCRIPT</label>
    </div>
    <br><br>
    <div>
<input type="checkbox" name="coding" id="tailwindcss">
          <label for="tailwind">TAILWIND-CSS</label>
    </div>
    <br><br>
    <div>
 <input type="checkbox" name="coding" id="react">
          <label for="react">REACT</label>
    </div>
    <br><br>
    <div>
 <input type="checkbox" name="coding" id="typescript">
      <label for="typescript">TYPESCRIPT</label>
    </div>
    <br><br>
</fieldset>
</body>
</html>
