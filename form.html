<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM</title>
  </head>
  <body>
    <form action="">
      <fieldset>
        <legend>daily checker</legend>
        <div>
          <label for="name">Name:</label><br />
          <input type="text" name="username" required />
        </div>
        <br /><br />
        <div>
          <label for="age">Age:</label><br />
          <input type="number" />
        </div>
        <br /><br />
        <div>
          <label for="phone">Phone:</label><br />
          <input type="tel" required />
        </div>
        <br /><br />
        <div>
          <label for="currently focus on">Focusing on:</label>
          <input type="radio" name="coding" value="CSS" />
          <label for="html">HTML</label>
          <input type="radio" name="coding" value="HTML" />
          <label for="css">CSS</label>
          <input type="radio" name="coding" value="Javascript" />
          <label for="javascript">javascript</label>
          <br /><br />
          <textarea rows="5" cols="38">Provide any feedback</textarea>
          <input type="submit" />
        </div>
        <br /><br />
        <input type="reset" /><br /><br />
        <input type="button" value="Click me" />
      </fieldset>
    </form>

    <br /><br /><br /><br /><br />

    <form>
      <fieldset>
        <legend style="text-align: center">Form</legend>
        <label for="Name">Name:</label><br />
        <input
          id="Name"
          type="text"
          name="text"
          placeholder="Enter your FullName..."
        /><br /><br />
        <label for="Email">Email:</label><br />
        <input
          id="Email"
          type="email"
          name="email"
          placeholder="Enter Email..."
          required
        /><br /><br />
        <label for="Number">Phone Number:</label><br />
        <input
          id="Number"
          type="tel"
          name="number"
          placeholder="Enter Number"
          required
        /><br /><br />
        <label for="referral">Refferal Code(Optional):</label><br />
        <input
          id="referral"
          type="text"
          name="refferal"
          placeholder="Enter refferal Code"
        /><br /><br />
        <input id="submit" type="submit" value="SUBMIT" />
      </fieldset>
    </form>
  </body>
</html>
