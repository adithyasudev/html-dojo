<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM</title>
  </head>
  <body>
    <form action="">
      <fieldset>
        <legend>daily checker</legend>
        <div>
          <label for="name">Name:</label><br />
          <input type="text" name="username" required />
        </div>
        <br /><br />
        <div>
          <label for="age">Age:</label><br />
          <input type="number" />
        </div>
        <br /><br />
        <div>
          <label for="phone">Phone:</label><br />
          <input type="tel" required />
        </div>
        <br /><br />
        <div>
          <label for="currently focus on">Focusing on:</label>
          <input type="radio" name="coding" value="CSS" />
          <label for="html">HTML</label>
          <input type="radio" name="coding" value="HTML" />
          <label for="css">CSS</label>
          <input type="radio" name="coding" value="Javascript" />
          <label for="javascript">javascript</label>
          <br /><br />
          <textarea rows="5" cols="38">Provide any feedback</textarea>
          <input type="submit" />
        </div>
        <br /><br />
        <input type="reset" /><br /><br />
        <input type="button" value="Click me" />
      </fieldset>
    </form>

    <br /><br /><br /><br /><br />

    <form>
      <fieldset>
        <legend style="text-align: center">Form</legend>
        <label for="Name">Name:</label><br />
        <input
          id="Name"
          type="text"
          name="text"
          placeholder="Enter your FullName..."
        /><br /><br />
        <label for="Email">Email:</label><br />
        <input
          id="Email"
          type="email"
          name="email"
          placeholder="Enter Email..."
          required
        /><br /><br />
        <label for="Number">Phone Number:</label><br />
        <input
          id="Number"
          type="tel"
          name="number"
          placeholder="Enter Number"
          required
        /><br /><br />
        <label for="referral">Refferal Code(Optional):</label><br />
        <input
          id="referral"
          type="text"
          name="refferal"
          placeholder="Enter refferal Code"
        /><br /><br />
        <input id="submit" type="submit" value="SUBMIT" />
      </fieldset>
      <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
    </form>
    <form action="">
      <label for="fname">First name:</label>
      <input
        type="text"
        id="fname"
        name="fname"
        minlength="4"
        maxlength="8"
        placeholder="Enter your name..."
        required
      /><br /><br />
      <label for="email">Email:</label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="sophie@example.com"
      /><br /><br />
      <label for="password">Password:</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="enter your password"
      /><br /><br />
      <label for="department">Department:</label>
      <select name="departments" id="department">
        <option value="choose the department">
          Please choose the Department
        </option>
        <option value="Human Resource">Human Resource</option>
        <option value="Management">Management</option>
        <option value="Electronics">Electronics</option>
        <option value="Finance">Finance</option></select
      ><br /><br />
      <fieldset>
        <legend>Select A Gender</legend>
        <input type="radio" id="male" name="gender" value="Male" />
        <label for="male">Male</label><br /><br />
        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female">Female</label>
      </fieldset>
      <br /><br />
      <label for="options">Food Preferences:</label><br />
      <input type="checkbox" id="pizza" name="pizzeria" />
      <label for="pizza">Pizza</label>
      <input type="checkbox" id="burger" name="burgeria" />
      <label for="burger">Burger</label>
      <input type="checkbox" id="shawarma" name="Arabian" />
      <label for="shawarma">Shawarma</label><br /><br />
      <label for="files">Choose a Profile Picture:</label>
      <input type="file" id="files" name="file" /><br /><br />
      <input type="submit" value="SUBMIT" />
    </form>
  </body>
</html>
